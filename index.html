<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aero Express - Easy Flights booked here!</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.2.4/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.2.4/core.js"></script>

    <style>
        body {
            background-image: url(index.pdf);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .navbar {
            width: 100%;
            background-color: #1b2a42;
            border-radius: 15px;
        }

        .card {
            background-color: #1b2a42d1;
            color: #ffffff;
            border-radius: 15px;
            border: 5px solid #1b2a42;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);;
        }

        .pop-up {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1055;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .pop-up.show {
            display: flex;
        }

        .pop-up-center {
            width: 100%;
            max-width: 500px;
        }

        .content {
            background-color: #212529;
            color: #ffffff;
            border: 1px solid;
            border-radius: 8px;
        }

        #error .content {
            border-color: #dc3545;
        }

        #reset .content {
            border-color: #ffc107;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid;
        }

        .title {
            margin: 0;
            font-size: 20px;
        }

        .pop-up-msg {
            padding: 16px;
        }

        .footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">✈️ Aero Express</a>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4 shadow">
                    <h2 class="text-center mb-4">Flight Booking</h2>

                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="first_name" class="form-label">First Name:</label>
                            <input type="text" id="first_name" class="form-control" placeholder="e.g. Juan">
                        </div>
                        <div class="col-md-6">
                            <label for="last_name" class="form-label">Last Name:</label>
                            <input type="text" id="last_name" class="form-control" placeholder="e.g. Dela Cruz">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="departure_airport" class="form-label">Departure Airport:</label>
                        <select id="departure_airport" class="form-select">
                            <option value="">-- Select Departure Airport --</option>
                            <option value="NAIA">Ninoy Aquino International Airport (NAIA)</option>
                            <option value="CRK">Clark International Airport (CRK)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="flight_type" class="form-label">Flight Type:</label>
                        <select id="flight_type" class="form-select" py-change="update_routes">
                            <option value="">-- Select Flight Type --</option>
                            <option value="DOM">Domestic</option>
                            <option value="INT">International</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="ticket_type" class="form-label">Type of Ticket:</label>
                        <select id="ticket_type" class="form-select">
                            <option value="">-- Select Ticket Type --</option>
                            <option value="One-Way">One-Way</option>
                            <option value="Round-Trip">Round-Trip (2x fare)</option>
                            <option value="Multi-City">Multi-City (1.5x fare)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="route" class="form-label">Available Routes:</label>
                        <select id="route" class="form-select" disabled>
                            <option value="">Choose a flight type first</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="travel_class" class="form-label">Travel Class:</label>
                        <select id="travel_class" class="form-select">
                            <option value="">-- Select Travel Class --</option>
                            <option value="ECO">Economy Class (Standard Price)</option>
                            <option value="BUS">Business Class (+₱50,000 surcharge)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="ticket_count" class="form-label">Number of Tickets:</label>
                        <input type="number" id="ticket_count" class="form-control" value="1" min="1">
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button id="bookBtn" py-click="book_flight" class="btn btn-primary btn-lg">Continue to
                            Add-ons</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Error pop-up -->
    <div class="pop-up" id="error" aria-labelledby="error-label" aria-hidden="true">
        <div class="pop-up-center">
            <div class="content">
                <div class="header border-danger">
                    <h5 class="title text-danger" id="error-label">Booking error</h5>
                    <button type="button" class="btn-close btn-close-white" py-click="close_popup"
                        aria-label="Close"></button>
                </div>
                <div class="pop-up-msg" id="error-msg">Error: complete all fields before proceeding</div>
                <div class="footer border-danger">
                    <button type="button" class="btn btn-danger" py-click="close_popup">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="py" src="./main.py"></script>
</body>

</html>
